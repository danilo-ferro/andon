<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANDON · Entrar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23202C26'/%3E%3Cg fill='none' stroke='%23C5DEB9' stroke-width='7' stroke-linecap='round'%3E%3Cpath d='M 56.3 14.5 A 36 36 0 1 1 43.7 14.5'/%3E%3Cpath d='M 51.5 14.2 A 44 44 0 0 0 77.6 73.1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/andon.css">
<link rel="stylesheet" href="/entrar.css">
<script src="/guarda.js"></script>
</head>
<body class="corpo-entrar">

<main class="portao">
  <section class="cartao-entrar">
    <div class="marca-entrar">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="#202C26"/>
        <g fill="none" stroke="#C5DEB9" stroke-width="7" stroke-linecap="round">
          <path d="M 56.3 14.5 A 36 36 0 1 1 43.7 14.5"/>
          <path d="M 51.5 14.2 A 44 44 0 0 0 77.6 73.1"/>
        </g>
      </svg>
      <div>
        <div class="n">ANDON</div>
        <div class="s">Canaverde &amp; Aguiar</div>
      </div>
    </div>

    <h1>Entrar</h1>
    <p class="abertura">Acordos, Execução e Financeiro numa base só.</p>

    <form id="form" autocomplete="on">
      <div class="campo">
        <label for="email">E-mail</label>
        <input class="inp" id="email" name="email" type="email"
               autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="com-olho">
          <input class="inp" id="senha" name="password" type="password"
                 autocomplete="current-password" required>
          <button type="button" class="olho-bt" id="ver" aria-label="Mostrar senha">ver</button>
        </div>
      </div>
      <div id="recado"></div>
      <button class="bt p entrar-bt" id="entrar" type="submit">Entrar</button>
    </form>

    <div class="rodape-entrar">
      <button class="link-fraco" id="trocar">Trocar minha senha</button>
      <span class="sep">·</span>
      <span class="ajuda">Primeiro acesso? Use a senha provisória e troque em seguida.</span>
    </div>
  </section>
</main>

<script src="/entrar.js"></script>
</body>
</html>
